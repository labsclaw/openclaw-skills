name: Validate organizational skill library

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser for routing audit
        run: python -m pip install PyYAML==6.0.2
      - name: Validate routing descriptions and negative gate fixtures
        run: |
          python scripts/validate-routing-boundaries.py
          python scripts/test-routing-boundaries.py
      - name: Validate governance, structure, security, and trigger fixtures
        run: node scripts/validate-library.mjs
      - name: Verify generated catalog index
        run: node scripts/build-catalog.mjs --check
      - name: Test portable catalog checks
        run: node --test scripts/build-catalog.test.mjs
      - name: Validate SPDX metadata and third-party notices
        run: node scripts/validate-licenses.mjs
      - name: Test code review evidence helper
        run: node ultra-code-review-skill/scripts/code-review.test.cjs
      - name: Test bounded code context helper
        run: node --test ultra-code-context-skill/scripts/context-pack.test.mjs
      - name: Test SSC integrity and review regressions
        run: |
          node ultra-memory-skill/tests/test-memory-lint.cjs
          node --test ultra-memory-skill/tests/test-review-regressions.cjs
      - name: Test SSC evidence gate and isolated retrieval pilot
        run: node ultra-memory-skill/tests/test-evidence.cjs
